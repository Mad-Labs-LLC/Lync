name: Build Sample Project

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/test-build.yml'
    - 'Lync/**'
    - 'Sample/**'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:

    - name: Download repository
      uses: actions/checkout@v4

    - name: Extract Sample Project
      run: |
        mv Lync/ ../LyncBinaries/
        mv Sample/ ../temp/
        rm -r *
        mv -v ../temp/* ./

    - name: Install Rokit and Lune
      uses: CompeyDev/setup-rokit@v0.2.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies and pkg
      run: |
        cd ../LyncBinaries
        npm ci
        npm install -g pkg

    - name: Compile Lync
      run: |
        cd ../LyncBinaries
        pkg package.json --no-bytecode --public-packages "*" --public -t node18-linux-x64 -o lync-linux-x64

    - name: Build
      run: |
        ../LyncBinaries/lync-linux-x64 build

    # The built place is a CI check only; it is never published to Roblox from here.
